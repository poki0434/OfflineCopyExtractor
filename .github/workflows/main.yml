name: Build Offline Extractor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 下载 SenseVoice 离线语音模型与 Sherpa-ONNX 引擎
        run: |
          mkdir -p app/src/main/assets/sensevoice
          mkdir -p app/libs
          
          # 下载 SenseVoice Small 多语言/中文 int8 量化模型 (约 228MB)
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar -xjf sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx app/src/main/assets/sensevoice/
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt app/src/main/assets/sensevoice/
          
          # 下载 Sherpa-ONNX Android AAR 离线推理库 (arm64-v8a 适配骁龙 8 Elite)
          wget -q -O app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.30/sherpa-onnx-1.10.30.aar

      - name: 4. 生成 Gradle Wrapper 并编译 APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. 上传生成的安装包供下载
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCopyExtractor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
