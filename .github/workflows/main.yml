name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 生成 Gradle Wrapper 并编译 APK
        working-directory: ./OfflineCopyExtractor-v2
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传生成的安装包供下载
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: OfflineCopyExtractor-v2/app/build/outputs/apk/debug/*.apk
          retention-days: 30
