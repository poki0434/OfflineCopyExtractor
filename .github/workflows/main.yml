name: Build Offline Extractor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v5

      - name: 2. 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 下载 SenseVoice 模型与 Sherpa-ONNX Android AAR
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json, tarfile, zipfile, shutil

          project_root = "."
          for root, dirs, files in os.walk("."):
              if "settings.gradle.kts" in files:
                  project_root = root
                  break
          print("Detected project root:", project_root)

          assets_dir = os.path.join(project_root, "app/src/main/assets/sensevoice")
          libs_dir = os.path.join(project_root, "app/libs")
          os.makedirs(assets_dir, exist_ok=True)
          os.makedirs(libs_dir, exist_ok=True)

          req = urllib.request.Request("https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/asr-models", headers={"User-Agent": "Mozilla/5.0"})
          data = json.loads(urllib.request.urlopen(req).read().decode())
          model_url = next(a["browser_download_url"] for a in data["assets"] if "sense-voice-zh-en-ja-ko-yue" in a["name"] and a["name"].endswith(".tar.bz2"))
          print("Downloading Model:", model_url)
          urllib.request.urlretrieve(model_url, "model.tar.bz2")

          with tarfile.open("model.tar.bz2", "r:bz2") as tar:
              tar.extractall(".")
          extracted_dir = [d for d in os.listdir(".") if os.path.isdir(d) and "sense-voice" in d][0]
          shutil.copy(os.path.join(extracted_dir, "model.int8.onnx"), os.path.join(assets_dir, "model.int8.onnx"))
          shutil.copy(os.path.join(extracted_dir, "tokens.txt"), os.path.join(assets_dir, "tokens.txt"))

          req_rel = urllib.request.Request("https://api.github.com/repos/k2-fsa/sherpa-onnx/releases?per_page=10", headers={"User-Agent": "Mozilla/5.0"})
          releases = json.loads(urllib.request.urlopen(req_rel).read().decode())
          aar_asset_url = None
          for rel in releases:
              for a in rel.get("assets", []):
                  name = a["name"].lower()
                  if name.endswith(".aar") or ("android" in name and (name.endswith(".tar.bz2") or name.endswith(".zip"))):
                      aar_asset_url = a["browser_download_url"]
                      break
              if aar_asset_url:
                  break

          if not aar_asset_url:
              raise RuntimeError("未找到 Android AAR 发布包")

          print("Downloading Android package:", aar_asset_url)
          pkg_name = aar_asset_url.split("/")[-1]
          urllib.request.urlretrieve(aar_asset_url, pkg_name)

          if pkg_name.endswith(".aar"):
              shutil.copy(pkg_name, os.path.join(libs_dir, "sherpa-onnx.aar"))
          elif pkg_name.endswith(".tar.bz2"):
              with tarfile.open(pkg_name, "r:bz2") as tar:
                  tar.extractall("aar_tmp")
          elif pkg_name.endswith(".zip"):
              with zipfile.ZipFile(pkg_name, "r") as zf:
                  zf.extractall("aar_tmp")

          if os.path.exists("aar_tmp"):
              for r, _, fs in os.walk("aar_tmp"):
                  for f in fs:
                      if f.endswith(".aar"):
                          shutil.copy(os.path.join(r, f), os.path.join(libs_dir, "sherpa-onnx.aar"))
          EOF

      - name: 4. 生成 Gradle Wrapper 并编译 APK
        working-directory: ./OfflineCopyExtractor-v2
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 5. 上传生成的安装包供下载
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: OfflineCopyExtractor-v2/app/build/outputs/apk/debug/*.apk
          retention-days: 30
