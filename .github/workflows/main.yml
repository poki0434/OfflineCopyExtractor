name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 自动补齐 sherpa-onnx 离线引擎库
        working-directory: ./OfflineCopyExtractor-v2/app
        run: |
          mkdir -p libs
          if [ ! -f libs/sherpa-onnx-1.10.30.aar ]; then
            curl -L -o libs/sherpa-onnx-1.10.30.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.30/sherpa-onnx-1.10.30.aar
          fi

      - name: 生成 Gradle Wrapper 并编译 APK
        working-directory: ./OfflineCopyExtractor-v2
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传生成的安装包供下载
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: OfflineCopyExtractor-v2/app/build/outputs/apk/debug/*.apk
          retention-days: 30
