name: Build Offline Extractor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v5

      - name: 2. 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 下载 SenseVoice 离线语音模型与 Sherpa-ONNX AAR 引擎
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json, tarfile, shutil

          os.makedirs("app/src/main/assets/sensevoice", exist_ok=True)
          os.makedirs("app/libs", exist_ok=True)

          # 1. 下载 SenseVoice 多语言/中文 int8 量化模型
          req = urllib.request.Request("https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/asr-models", headers={"User-Agent": "Mozilla/5.0"})
          data = json.loads(urllib.request.urlopen(req).read().decode())
          model_url = next(a["browser_download_url"] for a in data["assets"] if "sense-voice-zh-en-ja-ko-yue" in a["name"] and a["name"].endswith(".tar.bz2"))
          print("Downloading Model:", model_url)
          urllib.request.urlretrieve(model_url, "model.tar.bz2")

          with tarfile.open("model.tar.bz2", "r:bz2") as tar:
              tar.extractall(".")
          extracted_dir = [d for d in os.listdir(".") if os.path.isdir(d) and "sense-voice" in d][0]
          shutil.copy(os.path.join(extracted_dir, "model.int8.onnx"), "app/src/main/assets/sensevoice/model.int8.onnx")
          shutil.copy(os.path.join(extracted_dir, "tokens.txt"), "app/src/main/assets/sensevoice/tokens.txt")

          # 2. 通过 HuggingFace API 自动扫描并下载最新的 sherpa-onnx Android AAR
          hf_api = "https://huggingface.co/api/models/csukuangfj/sherpa-onnx-libs/tree/main"
          req_hf = urllib.request.Request(hf_api, headers={"User-Agent": "Mozilla/5.0"})
          tree = json.loads(urllib.request.urlopen(req_hf).read().decode())

          aar_path = None
          for item in tree:
              if item["type"] == "file" and item["path"].endswith(".aar"):
                  aar_path = item["path"]
                  break
              elif item["type"] == "directory":
                  sub_req = urllib.request.Request(f"{hf_api}/{item['path']}", headers={"User-Agent": "Mozilla/5.0"})
                  sub_tree = json.loads(urllib.request.urlopen(sub_req).read().decode())
                  for sub in sub_tree:
                      if sub["type"] == "file" and sub["path"].endswith(".aar"):
                          aar_path = sub["path"]
                          break
              if aar_path:
                  break

          if not aar_path:
              raise RuntimeError("未找到 AAR 文件")

          aar_url = f"https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/{aar_path}"
          print("Downloading AAR:", aar_url)
          urllib.request.urlretrieve(aar_url, "app/libs/sherpa-onnx.aar")
          EOF

      - name: 4. 生成 Gradle Wrapper 并编译 APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. 上传生成的安装包供下载
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCopyExtractor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
