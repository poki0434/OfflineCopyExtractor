name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Android SDK 与缓存
        uses: android-actions/setup-android@v3

      - name: 授予 Gradle 执行权限
        working-directory: ./OfflineCopyExtractor-v2
        run: chmod +x gradlew

      - name: 云端编译打包 APK
        working-directory: ./OfflineCopyExtractor-v2
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传生成的 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: OfflineCopyExtractor-v2/app/build/outputs/apk/release/*.apk
          retention-days: 30
